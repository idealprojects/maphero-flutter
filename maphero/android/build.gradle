group 'com.maphero.app'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.maphero.app'
    }

    compileSdkVersion 35
    buildToolsVersion "35.0.0"

    ndkVersion "28.1.13356709"

    defaultConfig {
        minSdkVersion 21
        compileSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    dependencies {
        implementation "io.maphero:android-sdk:1.0.2"

        implementation('org.maplibre.gl:android-sdk-geojson:6.0.1') {
            exclude group: 'org.maplibre.gl', module: 'android-sdk'  // exclude default maplibre
        }

        implementation('org.maplibre.gl:maplibre-android-gestures:0.0.3') {
            exclude group: 'org.maplibre.gl', module: 'android-sdk'
        }

//        implementation('org.maplibre.gl:android-plugin-annotation-v9:3.0.0') {
//            exclude group: 'org.maplibre.gl', module: 'android-sdk'
//        }
//
//        implementation('org.maplibre.gl:android-plugin-offline-v9:3.0.0') {
//            exclude group: 'org.maplibre.gl', module: 'android-sdk'
//        }

        implementation 'com.jakewharton.timber:timber:5.0.1'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
}
